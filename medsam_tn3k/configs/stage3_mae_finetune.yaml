# Stage 3 MAE Fine-tuning Configuration
# Differential LR fine-tuning after MAE pretraining

medsam_checkpoint: "checkpoints/medsam_vit_b.pth"
pretrained_encoder_checkpoint: "outputs/stage3_mae_pretrain/checkpoints/best_encoder.pt"
train_split: "data/splits/seed0/train_labeled_10pct.json"
val_split: "data/splits/seed0/val.json"
boxes_file: "data/splits/seed0/boxes.json"
split_dir: "data/splits/seed0"
checkpoint_path: "outputs/stage3_mae_finetune/checkpoints/best.pt"
output_dir: "outputs/stage3_mae_finetune"

# Differential LR (3-group: encoder, prompt_encoder, mask_decoder)
encoder_lr: 1.0e-5
prompt_encoder_lr: 2.0e-4
mask_decoder_lr: 2.0e-4
weight_decay: 1.0e-4

# Training
epochs: 50
batch_size: 2
grad_accum_steps: 2
num_workers: 4
patience: 10
image_size: 1024
mask_size: 256

# Misc
seed: 0
log_level: "INFO"
