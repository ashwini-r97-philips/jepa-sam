# I-JEPA Pretraining Configuration
# Stage 4, Part 1: Self-supervised pretraining with Joint-Embedding Predictive Architecture

medsam_checkpoint: "checkpoints/medsam_vit_b.pth"
unlabeled_split: "data/splits/train_unlabeled_90pct.json"
output_dir: "outputs/stage4_jepa_pretrain"

# JEPA architecture
predictor_embed_dim: 384
predictor_depth: 6
predictor_num_heads: 12
ema_momentum_start: 0.996
ema_momentum_end: 1.0

# Masking
grid_size: 64
num_pred_masks: 4
pred_mask_scale: [0.15, 0.2]
enc_mask_scale: [0.85, 1.0]

# Training
epochs: 300
batch_size: 4
encoder_lr: 1.0e-4
predictor_lr: 1.0e-4
weight_decay: 0.05
num_workers: 4
image_size: 1024

# Misc
seed: 0
log_level: "INFO"
